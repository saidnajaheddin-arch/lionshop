<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionShop - المتجر الرسمي لإدارة Mبيعات</title>
    <!-- تصحيح روابط مكتبة الصور التفاعلية لتشتغل بسلاسة -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        :root {
            --primary-color: #00FF66; 
            --dark-color: #111;
            --gold-color: #d4af37;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            position: relative;
            background-image: url('https://ibb.co'); 
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 50px 20px;
            border-bottom: 4px solid var(--gold-color);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        header .logo-container {
            background-image: url('https://ibb.co'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 100%;
            height: 160px;
            margin: 0 auto;
        }
        .container {
            max-width: 600px;
            margin: -20px auto 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }
        .swiper {
            width: 100%;
            height: 380px;
            border-radius: 8px;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            text-align: center;
            margin-top: 20px;
        }
        .price {
            font-size: 24px;
            color: #e4393c;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-order {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: #000;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 25px rgba(0, 255, 102, 0.5);
            animation: pulse-animation 1.5s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 5px 25px rgba(0, 255, 102, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 5px 35px rgba(0, 255, 102, 0.8); }
            100% { transform: scale(1); box-shadow: 0 5px 25px rgba(0, 255, 102, 0.5); }
        }
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .required::after {
            content: " *";
            color: red;
        }
        .btn-submit {
            background-color: #0084ff;
            color: #fff;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .admin-trigger {
            display: block;
            text-align: center;
            margin: 40px auto;
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container"></div>
</header>

<div class="container">
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="swiperWrapper">
            <!-- المنتجات تظهر ديناميكياً من لوحة التحكم -->
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="product-info">
        <h2 id="displayTitle">جاري تحميل المنتج...</h2>
        <p class="price" id="displayPrice">0 درهم</p>
        <button class="btn-order" onclick="openPopup()">اضغط هنا للطلب في دقيقة واحدة! 🛒</button>
    </div>
</div>

<!-- نافذة العميل المنبثقة للطلب السريع -->
<div class="popup-overlay" id="orderPopup">
    <div class="popup-content">
        <h3 style="text-align: center; margin-top: 0; color: #111;">تأكيد الطلب السريع</h3>
        <form id="checkoutForm" onsubmit="sendToWhatsApp(event)">
            
            <div class="form-group">
                <label class="required">اللون المتاح:</label>
                <select id="prodColor" required></select>
            </div>

            <div class="form-group">
                <label class="required">المقاس:</label>
                <select id="prodSize" required></select>
            </div>

            <div class="form-group">
                <label class="required">العدد المطلوب:</label>
                <input type="number" id="prodQty" value="1" min="1" required>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <div class="form-group">
                <label class="required">الاسم بالكامل:</label>
                <input type="text" id="custName" placeholder="الإسم والنسب" required>
            </div>

            <div class="form-group">
                <label class="required">رقم الواتساب:</label>
                <input type="tel" id="custPhone" placeholder="مثال: 0612345678" required>
            </div>

            <div class="form-group">
                <label class="required">العنوان الكامل:</label>
                <input type="text" id="custAddress" placeholder="الحي، الشارع، رقم المنزل" required>
            </div>

            <div class="form-group">
                <label>أماكن مميزة للاستدلال على العنوان:</label>
                <input type="text" id="custLandmark" placeholder="مثال: بالقرب من صيدلية، مستشفى، مقهى...">
            </div>

            <div class="form-group">
                <label>ملاحظات إضافية (أوقات التواجد):</label>
                <textarea id="custNotes" placeholder="مثال: سأكون متواجد بعد الساعة الرابعة زوالاً"></textarea>
            </div>

            <button type="submit" class="btn-submit">تأكيد الطلب عبر الواتساب الآن 🚀</button>
            <button type="button" onclick="closePopup()" style="background:#aaa; margin-top:8px;" class="btn-submit">إلغاء</button>
        </form>
    </div>
</div>

<!-- 🔐 لوحة تحكم المدير المقفلة والمكملة بشكل صحيح -->
<div class="popup-overlay" id="adminPopup">
    <div class="popup-content">
        <h3 style="text-align: center; margin-top: 0; color: #d4af37;">🦁 لوحة إدارة المتجر الحكرية</h3>
        <div id="authSection">
            <div class="form-group">
                <label>أدخل رمز الإدارة السري الدخول:</label>
                <input type="password" id="adminCode" placeholder="اكتب رمز الإدارة هنا">
            </div>
            <button class="btn-submit" style="background:#d4af37;" onclick="checkAdminAuth()">دخول للوحة التحكم</button>
        </div>
        
        <div id="managementSection" style="display:none;">
            <h4>إضافة / تعديل المنتج وباقي الخصائص</h4>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="inputTitle" value="حذاء رياضي فاخر - تشكيلة الأسد الملكية">
            </div>
            <div class="form-group">
                <label>الثمن (بالدرهم):</label>
                <input type="text" id="inputPrice" value="299 درهم">
            </div>
            <div class="form-group">
                <label>الألوان المتاحة (افصل بينها بفاصلة):</label>
                <input type="text" id="inputColors" value="أسود ملكي, أبيض كلاسيكي, أحمر ناري">
            </div>
            <div class="form-group">
                <label>المقاسات المتاحة (افصل بينها بفاصلة):</label>
                <input type="text" id="inputSizes" value="40, 41, 42, 43">
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج الرئيسية:</label>
                <input type="text" id="inputImg1" value="https://unsplash.com">
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج الثانية:</label>
                <input type="text" id="inputImg2" value="https://unsplash.com">
            </div>
            <button class="btn-submit" style="background:#00FF66; color:#000;" onclick="saveProductData()">تحديث وحفظ التغييرات فوراً</button>
        </div>
        <button type="button" onclick="closeAdmin()" style="background:#aaa; Margin-top:12px;" class="btn-submit">إلغاء</button>
    </div>
</div>

<span class="admin-trigger" onclick="openAdmin()">⚙️ إدارة المتجر (خاص بالمدير)</span>
