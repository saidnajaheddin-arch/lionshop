<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionShop - المنتج البطل</title>
    <!-- استيراد مكتبة السلايدر ورسوم التحريك -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        :root {
            --primary-color: #00FF66; /* اللون الزاهي والمحفز للشراء */
            --dark-color: #111;
            --gold-color: #d4af37;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--dark-color);
            text-align: center;
            padding: 15px;
            border-bottom: 3px solid var(--gold-color);
        }
        header h1 {
            color: #fff;
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* السلايدر المتحرك للصور */
        .swiper {
            width: 100%;
            height: 350px;
            border-radius: 8px;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            text-align: center;
            margin-top: 15px;
        }
        .price {
            font-size: 22px;
            color: #e4393c;
            font-weight: bold;
        }
        /* زر الطلب النابض والمحفز */
        .btn-order {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: #000;
            text-align: center;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        /* النافذة المنبثقة (Popup) */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 10px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .required::after {
            content: " *";
            color: red;
        }
        .btn-submit {
            background-color: #0084ff;
            color: #fff;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>🦁 LIONSHOP</h1>
</header>

<div class="container">
    <!-- صور المنتج المتحركة -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="https://unsplash.com" id="p-img-1" alt="منتج 1"></div>
            <div class="swiper-slide"><img src="https://unsplash.com" id="p-img-2" alt="منتج 2"></div>
            <div class="swiper-slide"><img src="https://unsplash.com" id="p-img-3" alt="منتج 3"></div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="product-info">
        <h2>حذاء رياضي ملكي عالي الجودة</h2>
        <p class="price">299 درهم (التوصيل فابور)</p>
        <!-- زر الشراء المحفز -->
        <button class="btn-order" onclick="openPopup()">اضغط هنا للطلب في دقيقة واحدة! 🛒</button>
    </div>
</div>

<!-- نافذة الخيارات والطلب الإجباري -->
<div class="popup-overlay" id="orderPopup">
    <div class="popup-content">
        <h3 style="text-align: center; margin-top: 0;">أدخل معلوماتك لإتمام الطلب</h3>
        <form id="checkoutForm" onsubmit="sendToWhatsApp(event)">
            
            <!-- الخصائص والمقاسات -->
            <div class="form-group">
                <label class="required">اللون المتاح:</label>
                <select id="prodColor" required>
                    <option value="أسود ملَكي">أسود ملَكي</option>
                    <option value="أبيض كلاسيكي">أبيض كلاسيكي</option>
                    <option value="أحمر ناري">أحمر ناري</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required">المقاس:</label>
                <select id="prodSize" required>
                    <option value="40">40</option>
                    <option value="41">41</option>
                    <option value="42">42</option>
                    <option value="43">43</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required">العدد (الكمية):</label>
                <input type="number" id="prodQty" value="1" min="1" required>
            </div>

            <hr>

            <!-- معلومات العميل الإجبارية والاختيارية -->
            <div class="form-group">
                <label class="required">الاسم الكامل:</label>
                <input type="text" id="custName" placeholder="مثال: محمد العلمي" required>
            </div>

            <div class="form-group">
                <label class="required">رقم الواتساب:</label>
                <input type="tel" id="custPhone" placeholder="مثال: 0612345678" required>
            </div>

            <div class="form-group">
                <label class="required">العنوان الكامل:</label>
                <input type="text" id="custAddress" placeholder="اسم الحي ورقم المنزل" required>
            </div>

            <div class="form-group">
                <label>أماكن مميزة للاستدلال (اختياري):</label>
                <input type="text" id="custLandmark" placeholder="بجانب صيدلية، مقهى، مدرسة...">
            </div>

            <div class="form-group">
                <label>ملاحظات التوصيل (اختياري):</label>
                <textarea id="custNotes" placeholder="مثال: غدي نكون ديسبونيبل مع الـ 6 دالعشية"></textarea>
            </div>

            <button type="submit" class="btn-submit">تأكيد الطلب عبر الواتساب دابا 🚀</button>
            <button type="button" onclick="closePopup()" style="background:#ccc; margin-top:5px;" class="btn-submit">إلغاء</button>
        </form>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
    // تفعيل السلايدر المتحرك للصور
    var swiper = new Swiper(".mySwiper", {
        pagination: { el: ".swiper-pagination", clickable: true },
        autoplay: { delay: 3000 }
    });

    function openPopup() { document.getElementById('orderPopup').style.display = 'flex'; }
    function closePopup() { document.getElementById('orderPopup').style.display = 'none'; }

    // إرسال البيانات المـفصلة للواتساب الخاص بك مع رابط الصورة المحددة
    function sendToWhatsApp(event) {
        event.preventDefault();
        
        // ⚠️ مهم جداً: استبدل الرقم أسفله برقم الواتساب الخاص بك (بصيغة كود المغرب الدولي بدون + أو 00)
        const myWhatsAppNumber = "212600000000"; 
        
        const color = document.getElementById('prodColor').value;
        const size = document.getElementById('prodSize').value;
        const qty = document.getElementById('prodQty').value;
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const address = document.getElementById('custAddress').value;
        const landmark = document.getElementById('custLandmark').value || "لم يذكر";
        const notes = document.getElementById('custNotes').value || "لا توجد";
        
        // جلب رابط صورة المنتج المختار 
        const productImg = document.getElementById('p-img-1').src;

        // صياغة الرسالة المفصلة والمنظمة بشكل احترافي
        const textMessage = `🦁 *طلب جديد من متجر LionShop!* \n\n` +
                            `📦 *المنتج:* حذاء رياضي ملكي\n` +
                            `🎨 *اللون المختار:* ${color}\n` +
                            `📐 *المقاس:* ${size}\n` +
                            `🔢 *الكمية:* ${qty}\n\n` +
                            `👤 *اسم العميل:* ${name}\n` +
                            `📞 *رقم الواتساب:* ${phone}\n` +
                            `📍 *العنوان:* ${address}\n` +
                            `🏛️ *معالم مميزة:* ${landmark}\n` +
                            `💬 *الملاحظة:* ${notes}\n\n` +
                            `🖼️ *صورة المنتج المعني:* ${productImg}`;

        const encodedMessage = encodeURIComponent(textMessage);
        const whatsappURL = `https://wa.me{myWhatsAppNumber}?text=${encodedMessage}`;
        
        // فتح الواتساب لإرسال الرسالة فوراً
        window.open(whatsappURL, '_blank');
    }
