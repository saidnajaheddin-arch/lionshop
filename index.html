<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LionShop — الصفحة الرئيسية</title>
    <style>
        /* ===== إعادة ضبط ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        /* ===== الهيدر ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f5c842;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a2e;
        }

        .logo h1 span {
            color: #f5c842;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cart-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #1a1a2e;
            transition: transform 0.3s ease;
        }

        .cart-btn:hover {
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: #00c853;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ===== القسم الرئيسي (Hero) ===== */
        .hero {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 40px 0 50px;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 280px;
        }

        .hero-text .badge {
            display: inline-block;
            background: #f5c842;
            color: #1a1a2e;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .hero-text h2 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            color: #1a1a2e;
        }

        .hero-text h2 span {
            color: #f5c842;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: #5a6a7a;
            margin-bottom: 24px;
            max-width: 460px;
            line-height: 1.6;
        }

        .hero-text .btn-hero {
            display: inline-block;
            padding: 16px 40px;
            background: #00c853;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.25);
            text-decoration: none;
        }

        .hero-text .btn-hero:hover {
            background: #00e676;
            transform: scale(1.03);
            box-shadow: 0 8px 35px rgba(0, 200, 83, 0.4);
        }

        .hero-image {
            flex: 1;
            min-width: 280px;
            display: flex;
            justify-content: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
        }

        /* ===== الفلتر ===== */
        .filters {
            display: flex;
            gap: 10px;
            margin: 30px 0 28px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 28px;
            background: #f5f7fa;
            border: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2a3a4a;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: #e8ecf2;
        }

        .filter-btn.active {
            background: #1a1a2e;
            color: #f5c842;
        }

        /* ===== المنتجات ===== */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .product {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            transition: all 0.4s ease;
        }

        .product:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border-color: #f5c842;
        }

        .product img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #f8f9fc;
        }

        .product-body {
            padding: 14px 16px 18px;
        }

        .product-body .cat {
            font-size: 0.6rem;
            color: #8a9aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .product-body h3 {
            font-size: 0.95rem;
            margin: 4px 0 2px;
            color: #1a1a2e;
        }

        .product-body .price {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a1a2e;
            margin: 4px 0 10px;
        }

        .product-body .gender-tag {
            display: inline-block;
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 50px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .gender-male {
            background: #dbeafe;
            color: #1e40af;
        }
        .gender-female {
            background: #fce4ec;
            color: #c62828;
        }
        .gender-unisex {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-order {
            display: block;
            width: 100%;
            padding: 13px;
            background: #00c853;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-order:hover {
            background: #00e676;
            transform: scale(1.02);
        }

        /* ===== النشرة البريدية ===== */
        .newsletter {
            background: #f8f9fc;
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            margin: 40px 0 30px;
        }

        .newsletter h2 {
            font-size: 1.5rem;
            color: #1a1a2e;
        }

        .newsletter h2 span {
            color: #f5c842;
        }

        .newsletter p {
            color: #6a7a8a;
            margin-bottom: 18px;
        }

        .newsletter-form {
            display: flex;
            gap: 12px;
            max-width: 460px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .newsletter-form input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid #e8ecf2;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: border 0.3s ease;
        }

        .newsletter-form input:focus {
            border-color: #00c853;
            outline: none;
        }

        .newsletter-form button {
            padding: 14px 32px;
            background: #00c853;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .newsletter-form button:hover {
            background: #00e676;
            transform: scale(1.02);
        }

        .nl-msg {
            margin-top: 14px;
            font-weight: 600;
            display: none;
        }

        .nl-msg.ok {
            color: #00c853;
            display: block;
        }
        .nl-msg.err {
            color: #e94560;
            display: block;
        }

        /* ===== السلة (Sidebar) ===== */
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .cart-overlay.open {
            display: block;
            opacity: 1;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 88vw;
            height: 100%;
            background: #fff;
            z-index: 1000;
            padding: 28px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.06);
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-sidebar .close-cart {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #2a3a4a;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cart-sidebar .close-cart:hover {
            transform: rotate(90deg);
        }

        .cart-sidebar .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f4f8;
        }

        .cart-sidebar .cart-header h2 {
            font-size: 1.3rem;
            color: #1a1a2e;
        }

        .cart-sidebar .cart-header h2 span {
            color: #f5c842;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f4f8;
        }

        .cart-item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            background: #f0f4f8;
            flex-shrink: 0;
        }

        .cart-item .info {
            flex: 1;
        }

        .cart-item .info h4 {
            font-size: 0.85rem;
            color: #1a1a2e;
        }

        .cart-item .info .price {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .cart-item .remove {
            background: none;
            border: none;
            color: #e94560;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.2s ease;
        }

        .cart-item .remove:hover {
            transform: scale(1.2);
        }

        .cart-total {
            padding: 18px 0;
            border-top: 2px solid #f0f4f8;
            margin-top: 12px;
        }

        .cart-total .row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.05rem;
            color: #1a1a2e;
        }

        .cart-total .row .free {
            color: #00c853;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-checkout {
            width: 100%;
            padding: 16px;
            background: #00c853;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 16px;
        }

        .btn-checkout:hover {
            background: #00e676;
            transform: scale(1.02);
        }

        .empty-cart {
            text-align: center;
            padding: 40px 0;
            color: #8a9aaa;
        }

        .empty-cart .big {
            font-size: 3.6rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== لوحة التحكم (مخفية) ===== */
        .admin-panel {
            display: none;
            background: #f8f9fc;
            border-radius: 24px;
            padding: 28px 24px;
            margin-top: 40px;
            border: 1px solid #e8ecf2;
        }

        .admin-panel.open {
            display: block;
        }

        .admin-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #1a1a2e;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .admin-grid input,
        .admin-grid select {
            padding: 11px 14px;
            border: 2px solid #e8ecf2;
            border-radius: 12px;
            font-size: 0.85rem;
            width: 100%;
        }

        .admin-grid input:focus,
        .admin-grid select:focus {
            border-color: #00c853;
            outline: none;
        }

        .admin-grid .btn-add {
            padding: 11px 20px;
            background: #00c853;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-grid .btn-add:hover {
            background: #00e676;
            transform: scale(1.02);
        }

        .admin-list {
            margin-top: 18px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #fff;
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid #e8ecf2;
        }

        .admin-item .del {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .admin-item .del:hover {
            background: #c62828;
        }

        /* ===== أزرار التحكم ===== */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            border: 2px solid #e8ecf2;
            color: #4a5a6a;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-toggle:hover {
            border-color: #f5c842;
            color: #f5c842;
            transform: rotate(90deg);
        }

        /* ===== الفوتر ===== */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            color: #8a9aaa;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
        }

        .footer span {
            color: #f5c842;
            font-weight: 700;
        }

        /* ===== استجابة ===== */
        @media (max-width: 640px) {
            .container {
                padding: 0 14px 100px;
            }
            .hero-text h2 {
                font-size: 2rem;
            }
            .hero {
                padding: 20px 0 30px;
                gap: 24px;
            }
            .hero-image img {
                max-width: 100%;
            }
            .products {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
            .product img {
                height: 180px;
            }
            .cart-sidebar {
                width: 100%;
                max-width: 100vw;
                right: -110%;
                padding: 20px 16px 30px;
            }
            .cart-sidebar.open {
                right: 0;
            }
            .admin-grid {
                grid-template-columns: 1fr;
            }
            .newsletter-form {
                flex-direction: column;
            }
            .newsletter-form input {
                min-width: auto;
            }
            .logo h1 {
                font-size: 1.2rem;
            }
            .logo img {
                width: 36px;
                height: 36px;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .products {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            }
        }
    </style>
</head>
<body>

    <!-- ===== الهيدر ===== -->
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="https://images.unsplash.com/photo-8a7ZTFKax_I?w=200&h=200&fit=crop&crop=center" alt="Lion" />
                <h1>LION<span>SHOP</span></h1>
            </div>
            <div class="header-actions">
                <button class="cart-btn" id="cartToggle">
                    🛒
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </header>

        <!-- ===== القسم الرئيسي ===== -->
        <section class="hero">
            <div class="hero-text">
                <span class="badge">🦁 تشكيلة جديدة</span>
                <h2>أطلق العنان <br /><span>لإطلالتك</span></h2>
                <p>ملابس، أحذية وإكسسوارات فاخرة بأفضل الأسعار. توصيل مجاني لجميع الطلبات.</p>
                <button class="btn-hero" onclick="document.querySelector('.products').scrollIntoView({behavior:'smooth'})">
                    تسوق الآن 👑
                </button>
            </div>
            <div class="hero-image">
                <img src="https://images.unsplash.com/photo-8a7ZTFKax_I?w=800&h=500&fit=crop&crop=center" alt="Lion Shop" />
            </div>
        </section>

        <!-- ===== الفلتر ===== -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-gender="all">👑 الكل</button>
            <button class="filter-btn" data-gender="male">🦁 رجالي</button>
            <button class="filter-btn" data-gender="female">🦁 نسائي</button>
            <button class="filter-btn" data-gender="unisex">🦁 يونيسكس</button>
        </div>

        <!-- ===== المنتجات ===== -->
        <div class="products" id="productsGrid"></div>

        <!-- ===== النشرة البريدية ===== -->
        <div class="newsletter">
            <h2>📬 اشترك في <span>النشرة البريدية</span></h2>
            <p>توصل بكل جديد وعروض حصرية</p>
            <form class="newsletter-form" id="nlForm">
                <input type="email" id="nlEmail" placeholder="أدخل بريدك الإلكتروني" required />
                <button type="submit">اشترك الآن 🚀</button>
            </form>
            <div class="nl-msg" id="nlMsg"></div>
        </div>

        <!-- ===== لوحة التحكم ===== -->
        <div class="admin-panel" id="adminPanel">
            <h2>🛠 إدارة المنتجات</h2>
            <div class="admin-grid">
                <input type="text" id="pName" placeholder="اسم المنتج" />
                <input type="text" id="pPrice" placeholder="السعر (درهم)" />
                <input type="text" id="pImage" placeholder="رابط الصورة" />
                <select id="pGender">
                    <option value="male">رجالي</option>
                    <option value="female">نسائي</option>
                    <option value="unisex">يونيسكس</option>
                </select>
                <input type="text" id="pCategory" placeholder="ملابس/أحذية/إكسسوارات" />
                <button class="btn-add" id="addBtn">➕ إضافة</button>
            </div>
            <div class="admin-list" id="adminList"></div>
        </div>

        <!-- ===== الفوتر ===== -->
        <div class="footer">🦁 <span>LIONSHOP</span> — الفخامة أسلوب حياة</div>
    </div>

    <!-- ===== السلة ===== -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 سلة <span>الأسد</span></h2>
            <button class="close-cart" id="closeCart">✕</button>
        </div>
        <div id="cartContent">
            <div class="empty-cart">
                <span class="big">🦁</span>
                <p>السلة فارغة</p>
            </div>
        </div>
    </div>

    <!-- ===== زر لوحة التحكم ===== -->
    <button class="admin-toggle" id="adminToggle" title="إدارة">⚙️</button>

    <script>
        // ============================================================
        //  البيانات
        // ============================================================
        let products = [
            { id: 1, name: 'تيشيرت قطني أنيق', price: '150 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=T-Shirt',
                gender: 'male', category: 'ملابس' },
            { id: 2, name: 'فستان صيفي منقوش', price: '320 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=Dress',
                gender: 'female', category: 'ملابس' },
            { id: 3, name: 'حذاء رياضي أبيض', price: '450 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=Shoes',
                gender: 'unisex', category: 'أحذية' },
            { id: 4, name: 'حذاء جلد كلاسيك', price: '520 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=Leather',
                gender: 'male', category: 'أحذية' },
            { id: 5, name: 'ساعة يد أنيقة', price: '280 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=Watch',
                gender: 'unisex', category: 'إكسسوارات' },
            { id: 6, name: 'نظارة شمسية عصرية', price: '190 درهم', image: 'https://via.placeholder.com/400x260/f8f9fc/1a1a2e?text=Glasses',
                gender: 'female', category: 'إكسسوارات' },
        ];
        let nextId = 7;
        let cart = [];
        let currentFilter = 'all';

        // ============================================================
        //  تلغرام
        // ============================================================
        const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';
        const CHAT_ID = 'YOUR_CHAT_ID_HERE';

        // ============================================================
        //  عرض المنتجات
        // ============================================================
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = currentFilter === 'all' ? products : products.filter(p => p.gender === currentFilter);

            if (!filtered.length) {
                grid.innerHTML =
                    `<p style="grid-column:1/-1;text-align:center;padding:50px 0;color:#8a9aaa;">🦁 لا توجد منتجات</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const genderLabel = p.gender === 'male' ? 'رجالي' : p.gender === 'female' ? 'نسائي' : 'يونيسكس';
                const genderClass = p.gender === 'male' ? 'gender-male' : p.gender === 'female' ? 'gender-female' :
                    'gender-unisex';
                return `
                    <div class="product">
                        <img src="${p.image}" alt="${p.name}" loading="lazy" />
                        <div class="product-body">
                            <div class="cat">${p.category}</div>
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                            <span class="gender-tag ${genderClass}">${genderLabel}</span>
                            <button class="btn-order" data-id="${p.id}">اطلب الآن</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.btn-order').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const product = products.find(p => p.id === id);
                    if (product) openOrder(product);
                });
            });
        }

        // ============================================================
        //  السلة
        // ============================================================
        function renderCart() {
            const container = document.getElementById('cartContent');
            const badge = document.getElementById('cartBadge');

            if (!cart.length) {
                container.innerHTML = `<div class="empty-cart"><span class="big">🦁</span><p>السلة فارغة</p></div>`;
                badge.textContent = '0';
                return;
            }

            let total = 0;
            let html = '';
            cart.forEach((item, idx) => {
                const priceNum = parseInt(item.price.replace(/\D/g, ''));
                total += priceNum;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" />
                        <div class="info">
                            <h4>${item.name}</h4>
                            <div class="price">${item.price}</div>
                        </div>
                        <button class="remove" onclick="removeFromCart(${idx})">✕</button>
                    </div>
                `;
            });

            html += `
                <div class="cart-total">
                    <div class="row"><span>المجموع</span><span>${total} درهم</span></div>
                    <div class="row" style="font-size:0.85rem;color:#00c853;"><span>🚚 التوصيل</span><span class="free">مجاني</span></div>
                </div>
                <button class="btn-checkout" onclick="checkout()">إتمام الطلب 🛒</button>
            `;

            container.innerHTML = html;
            badge.textContent = cart.length;
        }

        function addToCart(product) {
            if (cart.some(p => p.id === product.id)) {
                alert('🦁 المنتج موجود بالفعل في السلة');
                return;
            }
            cart.push({ ...product });
            renderCart();
            openCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            if (!cart.length) closeCart();
        }

        function checkout() {
            if (!cart.length) return alert('السلة فارغة');
            const first = cart[0];
            openOrder(first);
            closeCart();
        }

        // ============================================================
        //  السلة — فتح وإغلاق
        // ============================================================
        function openCart() {
            document.getElementById('cartOverlay').classList.add('open');
            document.getElementById('cartSidebar').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            document.getElementById('cartOverlay').classList.remove('open');
            document.getElementById('cartSidebar').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('cartToggle').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.contains('open') ? closeCart() : openCart();
        });
        document.getElementById('closeCart').addEventListener('click', closeCart);
        document.getElementById('cartOverlay').addEventListener('click', closeCart);

        // ============================================================
        //  نموذج الطلب
        // ============================================================
        let orderProduct = null;

        function openOrder(product) {
            orderProduct = product;
            const name = prompt('👤 أدخل اسمك الكامل:');
            if (!name) return;
            const phone = prompt('📱 أدخل رقم واتساب:');
            if (!phone) return;
            const email = prompt('📧 البريد الإلكتروني (اختياري):') || 'غير مدخل';
            const notes = prompt('📝 ملاحظات إضافية (اختياري):') || 'لا توجد';

            const msg = `
        🦁 **طلب جديد — LionShop**
        👤 الاسم: ${name}
        📱 واتساب: ${phone}
        📧 البريد: ${email}
        📦 المنتج: ${product.name} — ${product.price}
        📝 ملاحظات: ${notes}
        🚚 التوصيل: مجاني
        📅 ${new Date().toLocaleString('ar-MA')}
        `;

            sendTelegram(msg, product.image);
        }

        // ============================================================
        //  إرسال تلغرام
        // ============================================================
        async function sendTelegram(text, image) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'Markdown' })
                });
                const data = await res.json();
                if (data.ok) {
                    alert('✅ تم استلام طلبك! سنتواصل معك قريباً');
                    cart = [];
                    renderCart();
                    if (image) {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: CHAT_ID, photo: image, caption: `🦁 ${orderProduct.name}` })
                        });
                    }
                } else {
                    alert('❌ فشل الإرسال، تأكد من التوكن');
                }
            } catch (e) {
                alert('❌ خطأ في الاتصال');
                console.error(e);
            }
        }

        // ============================================================
        //  الفلتر
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.gender;
                renderProducts();
            });
        });

        // ============================================================
        //  إدارة المنتجات
        // ============================================================
        function renderAdmin() {
            const list = document.getElementById('adminList');
            if (!products.length) {
                list.innerHTML = '<p style="color:#8a9aaa;">لا توجد منتجات</p>';
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="admin-item">
                    <span>${p.name} — ${p.price}</span>
                    <button class="del" data-id="${p.id}">حذف</button>
                </div>
            `).join('');

            document.querySelectorAll('.admin-item .del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    if (confirm('تأكيد الحذف؟')) {
                        products = products.filter(p => p.id !== id);
                        renderProducts();
                        renderAdmin();
                    }
                });
            });
        }

        document.getElementById('addBtn').addEventListener('click', function() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const image = document.getElementById('pImage').value.trim();
            const gender = document.getElementById('pGender').value;
            const category = document.getElementById('pCategory').value.trim();

            if (!name || !price || !image || !category) {
                alert('⚠️ جميع الحقول إجبارية');
                return;
            }

            products.push({ id: nextId++, name, price, image, gender, category });
            renderProducts();
            renderAdmin();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
            document.getElementById('pCategory').value = '';
            alert('✅ تمت الإضافة');
        });

        // ============================================================
        //  لوحة التحكم — فتح/إغلاق بكلمة سر
        // ============================================================
        let adminOpen = false;
        document.getElementById('adminToggle').addEventListener('click', function() {
            if (!adminOpen) {
                const pass = prompt('🔑 كلمة المرور:');
                if (pass === 'lion2026') {
                    adminOpen = true;
                    document.getElementById('adminPanel').classList.add('open');
                    this.style.borderColor = '#00c853';
                    this.style.color = '#00c853';
                    renderAdmin();
                } else if (pass !== null) {
                    alert('❌ كلمة خاطئة');
                }
            } else {
                adminOpen = false;
                document.getElementById('adminPanel').classList.remove('open');
                this.style.borderColor = '#e8ecf2';
                this.style.color = '#4a5a6a';
            }
        });

        // ============================================================
        //  النشرة البريدية
        // ============================================================
        document.getElementById('nlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('nlEmail').value.trim();
            const msg = document.getElementById('nlMsg');

            if (!email) {
                msg.textContent = '⚠️ أدخل بريداً صحيحاً';
                msg.className = 'nl-msg err';
                return;
            }

            const text = `📬 **اشتراك جديد**\n📧 ${email}\n🦁 LionShop\n📅 ${new Date().toLocaleString('ar-MA')}`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'Markdown' })
                });
                const data = await res.json();
                if (data.ok) {
                    msg.textContent = '✅ تم الاشتراك بنجاح!';
                    msg.className = 'nl-msg ok';
                    document.getElementById('nlEmail').value = '';
                } else {
                    msg.textContent = '❌ فشل الإرسال';
                    msg.className = 'nl-msg err';
                }
            } catch (err) {
                msg.textContent = '❌ خطأ في الاتصال';
                msg.className = 'nl-msg err';
                console.error(err);
            }
        });

        // ============================================================
        //  التشغيل
        // ============================================================
        renderProducts();
        renderCart();
    </script>

</body>
</html>
